<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>귀화시험 연습 (쉬운 버전, 10회)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --main:#2f7d4f;
  --main-dark:#1e5c38;
  --bg:#fbf8f2;
  --card-bg:#ffffff;
  --border:#e5e0d5;
  --ink:#222;
  --correct:#2e7d32;
  --correct-bg:#e8f5e9;
  --correct-border:#a5d6a7;
  --wrong:#c62828;
  --wrong-bg:#fdecea;
  --wrong-border:#ef9a9a;
  --muted:#777;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  font-family:'Gothic A1',sans-serif;
  color:var(--ink);
  padding-bottom:40px;
}
.header{
  background:linear-gradient(135deg,var(--main-dark),var(--main));
  color:#fff;
  padding:16px 0 12px;
  border-radius:0 0 22px 22px;
  text-align:center;
}
.header h1{
  font-size:16px;
  margin:0 18px 4px;
  font-weight:800;
}
.header .sub{
  font-size:12px;
  margin:0 18px 12px;
  opacity:.9;
}
.round-tabs{
  display:flex;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  gap:6px;
  padding:0 12px;
}
.round-tabs::-webkit-scrollbar{display:none;}
.round-tab{
  flex:0 0 auto;
  min-height:38px;
  display:flex;
  align-items:center;
  padding:8px 14px;
  background:rgba(255,255,255,.16);
  color:#fff;
  border:1px solid rgba(255,255,255,.35);
  border-radius:999px;
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}
.round-tab.active{
  background:#fff;
  color:var(--main-dark);
  border-color:#fff;
}
.vi-toggle-wrap{
  padding:12px 18px 0;
  display:flex;
  justify-content:flex-end;
}
.vi-toggle{
  background:var(--card-bg);
  border:1px solid var(--main);
  color:var(--main);
  padding:6px 12px;
  border-radius:16px;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
}
.vi-toggle.active{
  background:var(--main);
  color:#fff;
}
.progress-wrap{
  padding:10px 18px 0;
}
.progress-bar-bg{
  background:var(--border);
  height:8px;
  border-radius:999px;
  overflow:hidden;
}
.progress-bar-fill{
  background:var(--main);
  height:100%;
  border-radius:999px;
  transition:width .3s;
}
.progress-label{
  text-align:right;
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  margin-top:4px;
}
.stage{
  padding:16px 18px 30px;
}
.card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px 16px;
  margin-bottom:16px;
}
.q-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;height:26px;
  background:var(--main);
  color:#fff;
  border-radius:50%;
  font-size:13px;
  font-weight:800;
  margin-right:8px;
}
.q-text{
  font-size:16.5px;
  font-weight:700;
  line-height:1.6;
  margin:10px 0 4px;
}
.q-vi{
  font-size:12.5px;
  font-weight:400;
  color:var(--muted);
  font-style:italic;
  line-height:1.5;
  margin-bottom:16px;
}
.options{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.option{
  min-height:46px;
  display:flex;
  flex-direction:column;
  padding:12px 14px;
  background:#fafafa;
  border:1.5px solid var(--border);
  border-radius:12px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}
.opt-vi{
  display:block;
  font-size:11.5px;
  font-weight:400;
  color:var(--muted);
  font-style:italic;
  margin-top:2px;
}
.option .icon{margin-right:6px;font-weight:800;}
.option:active{transform:scale(0.99);}
.option.correct{
  background:var(--correct-bg);
  border-color:var(--correct-border);
  color:var(--correct);
}
.option.wrong{
  background:var(--wrong-bg);
  border-color:var(--wrong-border);
  color:var(--wrong);
}
.option.disabled-look{
  opacity:.55;
}
.explanation{
  margin-top:14px;
  padding:12px 14px;
  background:var(--bg);
  border-radius:12px;
  font-size:13.5px;
  line-height:1.6;
  display:none;
}
.explanation.show{display:block;}
.explanation .label{
  font-weight:800;
  color:var(--main-dark);
  margin-bottom:4px;
  display:block;
}
.exp-vi{
  display:block;
  margin-top:6px;
  font-size:12.5px;
  color:var(--muted);
  font-style:italic;
  font-weight:400;
}
.info-card{
  background:#fff;
  border:1.5px dashed var(--border);
  border-radius:16px;
  padding:18px 16px;
  margin-bottom:16px;
  text-align:center;
}
.info-card .tag{
  display:inline-block;
  background:var(--main);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
  margin-bottom:10px;
}
.info-card p{
  font-size:16px;
  font-weight:700;
  margin:8px 0 2px;
  line-height:1.5;
}
.info-card .info-vi{
  font-size:12.5px;
  color:var(--muted);
  font-style:italic;
  margin-bottom:10px;
}
.info-card .sub{
  font-size:12.5px;
  color:var(--muted);
  line-height:1.5;
}
.next-btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:14px;
  background:var(--main);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}
.next-btn:disabled{
  background:#ccc;
  cursor:not-allowed;
}
.result-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
}
.result-score{
  font-size:38px;
  font-weight:800;
  color:var(--main);
  margin:10px 0;
}
.result-msg{
  font-size:14px;
  color:var(--muted);
  margin-bottom:16px;
  line-height:1.5;
}
.retry-btn{
  padding:11px 22px;
  border:none;
  border-radius:16px;
  background:var(--main);
  color:#fff;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="header">
  <h1>⭐ 귀화시험 연습 (쉬운 버전)</h1>
  <div class="sub">Luyện thi nhập tịch - Phiên bản dễ (10 회)</div>
  <div class="round-tabs" id="roundTabs"></div>
</div>

<div class="vi-toggle-wrap">
  <button class="vi-toggle active" id="viToggle">🇻🇳 번역 켜짐</button>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 0</div>
</div>

<div class="stage" id="stage"></div>

    {type:"info", text:"이름이 무엇입니까?", textVi:"Tên của anh/chị là gì?",
     sub:"자기 이름을 또박또박 말하는 연습을 해 보세요.",
     subVi:"Hãy luyện nói rõ ràng tên của mình."},
    {type:"info", text:"한국에 온 지 몇 년 됐습니까?", textVi:"Anh/Chị sống ở Hàn được mấy năm rồi?",

     sub:"좋아하는 활동을 자연스럽게 말해 보세요.",
     subVi:"Hãy nói tự nhiên về hoạt động mình thích."},
    {type:"info", text:"한국 생활 중 가장 좋은 점은 무엇입니까?", textVi:"Điều tốt nhất khi sống ở Hàn Quốc là gì?",

    {type:"info", text:"앞으로의 꿈이나 계획이 있습니까?", textVi:"Anh/Chị có ước mơ hay kế hoạch nào cho tương lai không?",

let currentRoundIdx = 0;
let current = 0;
let score = 0;
let answered = false;

function renderRoundTabs(){
  const wrap = document.getElementById('roundTabs');
  let html = "";
  rounds.forEach((r, i)=>{
    html += `<div class="round-tab ${i===currentRoundIdx?'active':''}" data-i="${i}">${i+1}회</div>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.round-tab').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentRoundIdx = +el.dataset.i;
      current = 0; score = 0;
      renderAll();
    });
  });
  const active = wrap.querySelector('.round-tab.active');
  if(active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
}

function renderProgress(){
  const roundData = rounds[currentRoundIdx];
  document.getElementById('progressWrap').style.display = "block";
  const pct = Math.round((current/roundData.items.length)*100);
  document.getElementById('progressFill').style.width = pct + "%";
  document.getElementById('progressLabel').textContent = `${current} / ${roundData.items.length}`;
}

function renderStage(){
  const stage = document.getElementById('stage');
  const roundData = rounds[currentRoundIdx];
  const quizCount = roundData.items.filter(i=>i.type==="mc").length;

  if(current >= roundData.items.length){
    renderProgress();
    let msg = "정말 잘하셨어요! / Làm rất tốt!";
    if(quizCount > 0){
      const ratio = score / quizCount;
      if(ratio < 0.5) msg = "조금 더 복습하면 훨씬 좋아질 거예요. / Ôn tập thêm sẽ tốt hơn nhiều.";
      else if(ratio < 0.8) msg = "잘하고 있어요! 조금만 더 연습해요. / Khá tốt! Hãy luyện tập thêm chút nữa.";
    } else {
      msg = "수고했어요! 실제 면접처럼 말하는 연습을 해 보세요. / Làm tốt lắm! Hãy luyện nói như phỏng vấn thật.";
    }
    let scoreLine = quizCount > 0 ? `${score} / ${quizCount}` : "완료 / Hoàn thành";
    stage.innerHTML = `
      <div class="result-card">
        <div style="font-size:15px;font-weight:700;">${roundData.title} 결과</div>
        <div class="result-score">${scoreLine}</div>
        <div class="result-msg">${msg}</div>
        <button class="retry-btn" id="retryBtn">다시 풀기 / Làm lại</button>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', ()=>{
      current = 0; score = 0;
      renderStage();
    });
    return;
  }

  const item = roundData.items[current];
  answered = false;
  let html = "";

  if(item.type === "info"){
    html += `<div class="info-card">
      <span class="tag">실전 질문 · 정답 없음</span>
      <p>${item.text}</p>
      ${showVi ? `<div class="info-vi">${item.textVi || ""}</div>` : ""}
      <div class="sub">${item.sub}</div>
      ${showVi ? `<div class="sub" style="font-style:italic;">${item.subVi || ""}</div>` : ""}
    </div>
    <button class="next-btn" id="nextBtn">다음 → / Tiếp</button>`;
  } else {
    html += `<div class="card">
      <div><span class="q-number">${current+1}</span></div>
      <div class="q-text">${item.q}</div>
      ${showVi ? `<div class="q-vi">${item.qVi || ""}</div>` : ""}
      <div class="options" id="optionsWrap">`;
    item.options.forEach((opt, idx)=>{
      const optVi = (item.optionsVi && item.optionsVi[idx]) ? item.optionsVi[idx] : "";
      html += `<div class="option" data-idx="${idx}" data-label="${opt.replace(/"/g,'&quot;')}" data-vi="${optVi.replace(/"/g,'&quot;')}">
        <span class="opt-label">${opt}</span>${(showVi && optVi) ? `<span class="opt-vi">${optVi}</span>` : ""}
      </div>`;
    });
    html += `</div>
      <div class="explanation" id="explBox"><span class="label">해설 / Giải thích</span>${item.exp}${showVi ? `<span class="exp-vi">${item.expVi || ""}</span>` : ""}</div>
    </div>
    <button class="next-btn" id="nextBtn" disabled>다음 → / Tiếp</button>`;
  }

  stage.innerHTML = html;
  renderProgress();

  if(item.type === "mc"){
    const opts = stage.querySelectorAll('.option');
    opts.forEach(opt=>{
      opt.addEventListener('click', ()=>{
        if(answered) return;
        answered = true;
        const idx = +opt.dataset.idx;
        opts.forEach(o=>{
          const oi = +o.dataset.idx;
          const label = o.dataset.label;
          const vi = o.dataset.vi;
          const viSpan = (showVi && vi) ? `<span class="opt-vi">${vi}</span>` : "";
          if(oi === item.answer){
            o.classList.add('correct');
            o.innerHTML = `<span class="icon">✓</span><span class="opt-label">${label}</span>${viSpan}`;
          } else if(oi === idx){
            o.classList.add('wrong');
            o.innerHTML = `<span class="icon">✕</span><span class="opt-label">${label}</span>${viSpan}`;
          } else {
            o.classList.add('disabled-look');
          }
        });
        if(idx === item.answer) score++;
        document.getElementById('explBox').classList.add('show');
        document.getElementById('nextBtn').disabled = false;
      });
    });
  }

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    current++;
    renderStage();
  });
}

function renderAll(){
  renderRoundTabs();
  renderStage();
}

document.getElementById('viToggle').addEventListener('click', function(){
  showVi = !showVi;
  this.textContent = showVi ? "🇻🇳 번역 켜짐" : "🇻🇳 번역 꺼짐";
  this.classList.toggle('active', showVi);
  renderStage();
});

renderAll();
</script>
